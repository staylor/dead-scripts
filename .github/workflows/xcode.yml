name: Xcode

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      xcode: ${{ steps.diff.outputs.xcode }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # A pull request is checked out as its merge commit, whose first parent is the base branch.
          base=HEAD^1
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            base=$BEFORE
          fi
          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "xcode=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$base" HEAD | grep -qE '^(xcode/|\.github/workflows/xcode\.yml$)'; then
            echo "xcode=true" >> "$GITHUB_OUTPUT"
          else
            echo "xcode=false" >> "$GITHUB_OUTPUT"
          fi

  # The check that branch rules require. Jobs skipped because nothing under xcode/ changed count as passing,
  # so this has to run even when a job it needs fails.
  ci:
    name: CI
    if: always()
    needs: [changes, build]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

  build:
    name: Build ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.xcode == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            destination: generic/platform=macOS
          - name: iOS + watchOS
            destination: generic/platform=iOS Simulator
          - name: tvOS
            destination: generic/platform=tvOS Simulator
    defaults:
      run:
        working-directory: xcode
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project leadsheets.xcodeproj \
            -scheme leadsheets \
            -destination "${{ matrix.destination }}" \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

  test:
    name: Test DeadSheetsKit
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Test
        run: swift test --package-path xcode/DeadSheetsKit
