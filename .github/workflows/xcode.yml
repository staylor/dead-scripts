name: Xcode

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A push to a pull request cancels its older run, but a run on main that has started is never cut short by the next merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      xcode: ${{ steps.diff.outputs.xcode }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # A pull request is checked out as its merge commit, whose first parent is the base branch.
          base=HEAD^1
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            base=$BEFORE
            # A push can add several commits, and the checkout has only the last two.
            git fetch --quiet --depth=1 origin "$base" || true
          fi
          # Documentation and this workflow don't change the app, so changing only them skips the Xcode jobs.
          # To test a workflow change, run the workflow manually on its branch.
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "xcode=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$base" HEAD | grep '^xcode/' | grep -qv '\.md$'; then
            echo "xcode=true" >> "$GITHUB_OUTPUT"
          else
            echo "xcode=false" >> "$GITHUB_OUTPUT"
          fi

  # The check for branch rules to require. Jobs skipped because nothing the app uses changed count as passing, so
  # this has to run, and fail, when a job it needs fails or the run is cancelled. The step needs always() too,
  # because a step's condition implicitly includes success(), which is false once the run is cancelled.
  ci:
    name: CI
    if: always()
    needs: [changes, build, test, ui-test, format]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        if: always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
        run: exit 1

  build:
    name: Build ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.xcode == 'true'
    runs-on: xcode-27
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            destination: generic/platform=macOS
          - name: iOS + watchOS
            destination: generic/platform=iOS
          - name: tvOS
            destination: generic/platform=tvOS
    defaults:
      run:
        working-directory: xcode
    steps:
      - uses: actions/checkout@v5
      # The UI tests build Debug for the simulators, so this archives for devices, as the TestFlight job does, unsigned.
      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project leadsheets.xcodeproj \
            -scheme leadsheets \
            -destination "${{ matrix.destination }}" \
            -archivePath "$RUNNER_TEMP/leadsheets.xcarchive" \
            -resultBundlePath Build.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions
      # The result bundle counts every warning, from asset catalogs and the linker as well as the compiler, where
      # SWIFT_TREAT_WARNINGS_AS_ERRORS would only catch Swift's.
      - name: Check for warnings
        run: |
          warnings=$(xcrun xcresulttool get build-results --path Build.xcresult | jq .warningCount)
          if [ "$warnings" != 0 ]; then
            echo "::error::The build has $warnings warnings."
            exit 1
          fi

  test:
    name: Test DeadSheetsKit
    needs: changes
    if: needs.changes.outputs.xcode == 'true'
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Test
        run: swift test --package-path xcode/DeadSheetsKit -Xswiftc -warnings-as-errors

  ui-test:
    name: UI tests (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.xcode == 'true'
    runs-on: xcode-27
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iPhone
            platform: iOS
            device: iPhone 18 Pro
          # Built with the iOS 27.1 SDK, the app fills iPhone Duo's displays, with its bars down the side. simctl can't
          # fold or unfold the simulator, so the tests see the pose it boots in.
          - name: iPhone Duo
            platform: iOS
            device: iPhone Duo
          - name: Apple TV
            platform: tvOS
            device: Apple TV 4K (3rd generation)
          # The deployment target is 26.0, and the image only has 27 simulators. These are the 26.5 releases' builds:
          # asking for version 26.5 sometimes installs its release candidate.
          - name: iPhone, iOS 26.5
            platform: iOS
            build: 23F77
            device: iPhone 17 Pro
          - name: Apple TV, tvOS 26.5
            platform: tvOS
            build: 23L470
            device: Apple TV 4K (3rd generation)
    defaults:
      run:
        working-directory: xcode
    steps:
      - uses: actions/checkout@v5
      - name: Install the simulator runtime
        if: matrix.build
        env:
          PLATFORM: ${{ matrix.platform }}
          BUILD: ${{ matrix.build }}
        run: |
          set -o pipefail
          xcodebuild -downloadPlatform "$PLATFORM" -buildVersion "$BUILD" -architectureVariant arm64
          # Deferred cleanup of stale runtime registrations can unmount the active simulator mid-test.
          # Keep the assets shared with their usable replacements, then remount those replacements.
          xcrun simctl runtime scan-and-mount
          xcrun simctl runtime list --json | jq -r '.[] | select(.state == "Unusable") | .identifier' |
            while IFS= read -r runtime; do
              xcrun simctl runtime delete "$runtime" --keep-asset
            done
          xcrun simctl runtime scan-and-mount
          # A simulator that boots before its runtime's dyld shared cache is built stays several times slower.
          xcrun simctl runtime dyld_shared_cache update --all
      - name: Pick a simulator
        id: simulator
        env:
          PLATFORM: ${{ matrix.platform }}
          BUILD: ${{ matrix.build }}
          DEVICE: ${{ matrix.device }}
        # Xcode can leave an older runtime's simulators out of its destinations, as Xcode 27.1 does with tvOS 27.0
        # once tvOS 27.2 is installed, so this uses the newest runtime for the device, adding the device to it when
        # it's missing. Runtimes made for one new model, such as iPhone Duo's, support only that model.
        run: |
          runtime=$(xcrun simctl list runtimes available --json |
            jq -r --arg platform "$PLATFORM" --arg build "$BUILD" --arg device "$DEVICE" '
              [.runtimes[] | select(.platform == $platform and ($build == "" or .buildversion == $build))
                | select(any(.supportedDeviceTypes[]?; .name == $device))]
              | sort_by(.version | split(".") | map(tonumber)) | last | .identifier // empty')
          if [ -z "$runtime" ]; then
            echo "::error::No $PLATFORM ${BUILD:-runtime} supports $DEVICE."
            exit 1
          fi
          udid=$(xcrun simctl list devices available --json | jq -r --arg runtime "$runtime" --arg device "$DEVICE" '
            [.devices[$runtime][]? | select(.name == $device)] | last | .udid // empty')
          if [ -z "$udid" ]; then
            udid=$(xcrun simctl create "$DEVICE" "$DEVICE" "$runtime")
          fi
          echo "destination=id=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep "$udid"
          # The test runner can stall while a cold simulator boots, and then never starts. The boot itself can also hang
          # at "Waiting on BackBoard": CI boots take under 5 minutes, so give up after 10 and boot the erased device again.
          boot() {
            xcrun simctl bootstatus "$udid" -b &
            local pid=$!
            SECONDS=0
            while kill -0 "$pid" 2>/dev/null; do
              if [ "$SECONDS" -ge 600 ]; then
                kill "$pid"
                return 1
              fi
              sleep 5
            done
            wait "$pid"
          }
          if ! boot; then
            echo "::warning::The simulator didn't finish booting in 10 minutes, so it's being erased and booted again."
            xcrun simctl shutdown "$udid" || true
            xcrun simctl erase "$udid"
            boot
          fi
      - name: Test
        env:
          DESTINATION: ${{ steps.simulator.outputs.destination }}
        run: |
          set -o pipefail
          xcodebuild test \
            -project leadsheets.xcodeproj \
            -scheme leadsheets \
            -destination "$DESTINATION" \
            -resultBundlePath UITests.xcresult \
            -retry-tests-on-failure -test-iterations 3 \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            | xcbeautify --renderer github-actions
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: UITests (${{ matrix.name }}).xcresult
          path: xcode/UITests.xcresult

  format:
    name: Format
    needs: changes
    if: needs.changes.outputs.xcode == 'true'
    runs-on: xcode-27
    timeout-minutes: 10
    defaults:
      run:
        working-directory: xcode
    steps:
      - uses: actions/checkout@v5
      - name: Lint
        run: swift format lint --recursive --strict .

  testflight:
    name: TestFlight ${{ matrix.name }}
    needs: [changes, ci]
    if: >-
      !cancelled() && needs.ci.result == 'success' && needs.changes.outputs.xcode == 'true'
      && github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: xcode-27
    timeout-minutes: 45
    environment: testflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iOS + watchOS
            destination: generic/platform=iOS
          - name: macOS
            destination: generic/platform=macOS
          - name: tvOS
            destination: generic/platform=tvOS
    defaults:
      run:
        working-directory: xcode
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v5
      # Archives are signed for development. Without that identity in the keychain, Xcode would create a new
      # certificate on every runner.
      - name: Install signing credentials
        env:
          ASC_KEY: ${{ secrets.ASC_KEY }}
          DEVELOPMENT_CERTIFICATE: ${{ secrets.DEVELOPMENT_CERTIFICATE }}
          DEVELOPMENT_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPMENT_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          for name in ASC_KEY ASC_KEY_ID ASC_ISSUER_ID DEVELOPMENT_CERTIFICATE DEVELOPMENT_CERTIFICATE_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::The testflight environment has no $name secret."
              exit 1
            fi
          done
          printf '%s\n' "$ASC_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(uuidgen)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          base64 --decode <<< "$DEVELOPMENT_CERTIFICATE" > "$RUNNER_TEMP/development.p12"
          security import "$RUNNER_TEMP/development.p12" -k "$keychain" -P "$DEVELOPMENT_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/development.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          if ! security find-identity -v -p codesigning "$keychain" | grep -q '1 valid identities found'; then
            echo "::error::The development certificate is missing or has expired. Replace the signing secrets."
            exit 1
          fi
      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project leadsheets.xcodeproj \
            -scheme leadsheets \
            -destination "${{ matrix.destination }}" \
            -archivePath "$RUNNER_TEMP/leadsheets.xcarchive" \
            -resultBundlePath "$RUNNER_TEMP/Archive.xcresult" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | xcbeautify --renderer github-actions
      - name: Check for warnings
        run: |
          warnings=$(xcrun xcresulttool get build-results --path "$RUNNER_TEMP/Archive.xcresult" | jq .warningCount)
          if [ "$warnings" != 0 ]; then
            echo "::error::The signed archive has $warnings warnings."
            exit 1
          fi
      # The export is signed with cloud-managed distribution certificates, and gets the next build number. It runs
      # rsync with arguments only the system rsync accepts, so keep Homebrew's off the PATH.
      - name: Upload to TestFlight
        run: |
          PATH="/usr/bin:$PATH" xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/leadsheets.xcarchive" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Remove signing credentials
        if: always()
        run: |
          if [ -e "$RUNNER_TEMP/signing.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/signing.keychain-db"
          fi
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/development.p12"
