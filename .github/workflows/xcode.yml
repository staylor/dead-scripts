name: Xcode

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A push to a pull request cancels its older run, but a run on main that has started is never cut short by the next merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      xcode: ${{ steps.diff.outputs.xcode }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # A pull request is checked out as its merge commit, whose first parent is the base branch.
          base=HEAD^1
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            base=$BEFORE
          fi
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "xcode=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$base" HEAD | grep -qE '^(xcode/|\.github/workflows/xcode\.yml$)'; then
            echo "xcode=true" >> "$GITHUB_OUTPUT"
          else
            echo "xcode=false" >> "$GITHUB_OUTPUT"
          fi

  # The check that branch rules require. Jobs skipped because nothing under xcode/ changed count as passing,
  # so this has to run, and fail, when a job it needs fails or the run is cancelled. The step needs always() too,
  # because a step's condition implicitly includes success(), which is false once the run is cancelled.
  ci:
    name: CI
    if: always()
    needs: [changes, build, test, ui-test, format]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        if: always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
        run: exit 1

  build:
    name: Build ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.xcode == 'true'
    runs-on: xcode-27
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            destination: generic/platform=macOS
          - name: iOS + watchOS
            destination: generic/platform=iOS Simulator
          - name: tvOS
            destination: generic/platform=tvOS Simulator
    defaults:
      run:
        working-directory: xcode
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project leadsheets.xcodeproj \
            -scheme leadsheets \
            -destination "${{ matrix.destination }}" \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

  test:
    name: Test DeadSheetsKit
    needs: changes
    if: needs.changes.outputs.xcode == 'true'
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Test
        run: swift test --package-path xcode/DeadSheetsKit

  ui-test:
    name: UI tests (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.xcode == 'true'
    runs-on: xcode-27
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iPhone
            runtime: iOS
            device: iPhone 18 Pro
          - name: Apple TV
            runtime: tvOS
            device: Apple TV 4K (3rd generation)
    defaults:
      run:
        working-directory: xcode
    steps:
      - uses: actions/checkout@v5
      - name: Pick a simulator
        id: simulator
        env:
          FAMILY: ${{ matrix.name }}
          RUNTIME: ${{ matrix.runtime }}
          DEVICE: ${{ matrix.device }}
        run: |
          udid=$(xcrun simctl list devices available --json | jq -r --arg runtime "$RUNTIME" --arg family "$FAMILY" --arg device "$DEVICE" '
            [.devices | to_entries | sort_by(.key)[] | select(.key | contains($runtime)) | .value[] | select(.name | startswith($family))]
            | (map(select(.name == $device)) | last) // last | .udid')
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep "$udid"
          # The test runner can stall while a cold simulator boots, and then never starts.
          xcrun simctl bootstatus "$udid" -b
      - name: Test
        run: |
          set -o pipefail
          xcodebuild test \
            -project leadsheets.xcodeproj \
            -scheme leadsheets \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -resultBundlePath UITests.xcresult \
            -retry-tests-on-failure -test-iterations 3 \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            | xcbeautify --renderer github-actions
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: UITests (${{ matrix.name }}).xcresult
          path: xcode/UITests.xcresult

  format:
    name: Format
    needs: changes
    if: needs.changes.outputs.xcode == 'true'
    runs-on: xcode-27
    timeout-minutes: 10
    defaults:
      run:
        working-directory: xcode
    steps:
      - uses: actions/checkout@v5
      - name: Lint
        run: swift format lint --recursive --strict .

  testflight:
    name: TestFlight ${{ matrix.name }}
    needs: [changes, ci]
    if: >-
      !cancelled() && needs.ci.result == 'success' && needs.changes.outputs.xcode == 'true'
      && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: xcode-27
    timeout-minutes: 45
    environment: testflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iOS + watchOS
            destination: generic/platform=iOS
          - name: macOS
            destination: generic/platform=macOS
          - name: tvOS
            destination: generic/platform=tvOS
    defaults:
      run:
        working-directory: xcode
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v5
      - name: Write the App Store Connect key
        env:
          ASC_KEY: ${{ secrets.ASC_KEY }}
        run: printf '%s\n' "$ASC_KEY" > "$RUNNER_TEMP/AuthKey.p8"
      # Archives are signed for development, and without an identity in the keychain, Xcode creates a new
      # certificate on every runner.
      - name: Install the development certificate
        env:
          DEVELOPMENT_CERTIFICATE: ${{ secrets.DEVELOPMENT_CERTIFICATE }}
          DEVELOPMENT_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPMENT_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(uuidgen)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          base64 --decode <<< "$DEVELOPMENT_CERTIFICATE" > "$RUNNER_TEMP/development.p12"
          security import "$RUNNER_TEMP/development.p12" -k "$keychain" -P "$DEVELOPMENT_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project leadsheets.xcodeproj \
            -scheme leadsheets \
            -destination "${{ matrix.destination }}" \
            -archivePath "$RUNNER_TEMP/leadsheets.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | xcbeautify --renderer github-actions
      # The export is signed with cloud-managed distribution certificates, and gets the next build number.
      - name: Upload to TestFlight
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/leadsheets.xcarchive" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
